---
# ЗАМЕНИ адреса, имена и пользователя на свои.
#
# Важно: имя хоста в инвентаре (cp1, worker1, ...) должно совпадать
# с именем ноды в `kubectl get nodes`. Если не совпадает — задай
# переменную k8s_node_name на хосте:
#
#   cp1:
#     ansible_host: 10.0.0.11
#     k8s_node_name: node-cp-1
#
all:
  children:
    k8s_cluster:
      children:
        k8s_control_plane:
          hosts:
            cp1:
              ansible_host: 10.0.0.11
            cp2:
              ansible_host: 10.0.0.12
            cp3:
              ansible_host: 10.0.0.13

        k8s_workers:
          hosts:
            worker1:
              ansible_host: 10.0.0.21
            worker2:
              ansible_host: 10.0.0.22
            worker3:
              ansible_host: 10.0.0.23
            worker4:
              ansible_host: 10.0.0.24
            worker5:
              ansible_host: 10.0.0.25

    # Машина, с которой выполняется kubectl (drain/uncordon).
    kubectl:
      hosts:
        localhost:
          ansible_connection: local
          ansible_become: false
