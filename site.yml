---
# Пошаговое обновление ОС на нодах Kubernetes.
# Только ОС-пакеты: kubelet/kubeadm/kubectl остаются held,
# версия Kubernetes не меняется.
#
# Порядок:
#   1. проверка кластера с локальной машины
#   2. аудит всех нод (read-only)
#   3. etcd snapshot
#   4. workers, строго по одной ноде
#   5. control plane, строго по одной ноде
#
# На каждом шаге: печатается вывод предыдущей команды, затем pause
# с требованием ввести yes. Любой другой ввод останавливает прогон.

- name: "1. Кластер глазами локальной машины (read-only)"
  hosts: localhost
  gather_facts: false
  tags: [preflight]
  tasks:
    - name: Версия kubectl
      ansible.builtin.command: kubectl version --client
      register: kubectl_ver
      changed_when: false

    - name: Все ноды Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get nodes --no-headers \
          | awk '$2 !~ /^Ready/ {print; bad=1} END {exit (bad ? 1 : 0)}'
      args:
        executable: /bin/bash
      register: nodes_ready
      changed_when: false

    - name: etcd healthy
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n kube-system exec etcd-{{ groups['k8s_control_plane'][0] }} -- \
          etcdctl --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          endpoint health --cluster
      args:
        executable: /bin/bash
      register: etcd_ok
      changed_when: false

    - name: Исходное состояние
      ansible.builtin.debug:
        msg:
          - "{{ kubectl_ver.stdout_lines | default([]) }}"
          - "{{ nodes_ready.stdout_lines | default([]) }}"
          - "{{ etcd_ok.stdout_lines | default([]) }}"

- name: "2. Аудит всех нод (read-only)"
  hosts: k8s_cluster
  gather_facts: false
  tags: [preflight]
  tasks:
    - name: Версии и ОС
      ansible.builtin.shell: |
        echo "kernel: $(uname -r)"
        echo "os: $(. /etc/os-release; echo "$PRETTY_NAME")"
        kubelet --version
        kubeadm version -o short
        containerd --version
      register: ver
      changed_when: false

    - name: Held-пакеты
      ansible.builtin.command: apt-mark showhold
      register: holds
      changed_when: false

    - name: Обязательные hold-пакеты
      ansible.builtin.assert:
        that:
          - item in holds.stdout_lines
        fail_msg: >-
          {{ inventory_hostname }}: пакет {{ item }} не на hold
          (held: {{ holds.stdout_lines | join(', ') }}).
          Выполни: apt-mark hold {{ k8s_hold_packages | join(' ') }}
        quiet: true
      loop: "{{ k8s_hold_packages }}"

    - name: Свободное место на /
      ansible.builtin.shell: df -Pk / | awk 'NR==2{print $4}'
      register: avail_kb
      changed_when: false

    - name: Нужно не меньше 5 GiB
      ansible.builtin.assert:
        that:
          - avail_kb.stdout | int > 5 * 1024 * 1024
        fail_msg: "{{ inventory_hostname }}: мало места ({{ avail_kb.stdout }} KiB)"
        quiet: true

    - name: Сводка
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}"
          - "{{ ver.stdout_lines | default([]) }}"
          - "held: {{ holds.stdout_lines | default([]) }}"
          - "avail: {{ avail_kb.stdout | trim }} KiB"

- name: "3. etcd snapshot"
  hosts: k8s_control_plane[0]
  gather_facts: false
  tags: [etcd]
  vars:
    etcd_node: "{{ inventory_hostname }}"
    snap_name: "etcd-snap-{{ lookup('pipe', 'date +%F-%H%M') }}.db"
  tasks:
    - import_tasks: tasks/90_etcd_backup.yml

- name: "4. Workers — по одной ноде"
  hosts: k8s_workers
  order: sorted
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  gather_facts: true
  tags: [nodes]
  tasks: &node_tasks
    - block:
        - import_tasks: tasks/00_preflight.yml
        - import_tasks: tasks/10_drain.yml
        - import_tasks: tasks/20_os.yml
        - import_tasks: tasks/30_reboot.yml
        - import_tasks: tasks/40_verify.yml
        - import_tasks: tasks/50_cleanup.yml
        - import_tasks: tasks/60_uncordon.yml
      rescue:
        - name: Зафиксировать сбой
          ansible.builtin.set_fact:
            report_failed_task: "{{ ansible_failed_task.name | default('неизвестный шаг', true) }}"
      always:
        - import_tasks: tasks/70_report.yml
        - name: Остановить прогон после отчёта
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }}: остановлено на шаге «{{ report_failed_task }}»"
          when: report_failed_task is defined

- name: "5. Control plane — по одной ноде"
  hosts: k8s_control_plane
  order: sorted
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  gather_facts: true
  tags: [nodes]
  tasks: *node_tasks
