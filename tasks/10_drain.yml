---
# Выселение подов с ноды. Сама нода при этом становится cordoned.

- name: Поды, которые будут выселены
  ansible.builtin.command: >-
    kubectl get pods -A --field-selector spec.nodeName={{ k8s_node_name }} -o wide
  delegate_to: "{{ kubectl_host }}"
  become: "{{ kubectl_become }}"
  register: pods_before
  changed_when: false

- import_tasks: _confirm.yml
  vars:
    prev_lines: "{{ pods_before.stdout_lines }}"
    step_name: "kubectl drain {{ k8s_node_name }}"

- name: Drain
  ansible.builtin.command:
    cmd: >-
      kubectl drain {{ k8s_node_name }}
      --ignore-daemonsets --delete-emptydir-data --timeout=600s
  delegate_to: "{{ kubectl_host }}"
  become: "{{ kubectl_become }}"
  register: drain
  changed_when: true

- name: Показать результат drain
  ansible.builtin.debug:
    msg: "{{ (drain.stdout_lines | default([])) + (drain.stderr_lines | default([])) }}"
