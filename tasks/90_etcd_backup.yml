---
# etcd snapshot перед началом работ.
#
# Важно: snapshot пишется в /var/lib/etcd внутри пода etcd.
# Этот путь смонтирован с хоста (hostPath), поэтому файл появляется
# на самой CP-ноде, откуда его забирает fetch.
#
# Ожидает переменные:
#   etcd_node — имя CP-ноды (например, cp1)
#   snap_name — имя файла снапшота

- import_tasks: _confirm.yml
  vars:
    prev_lines:
      - "etcd-{{ etcd_node }}"
      - "Снапшот: /var/lib/etcd/{{ snap_name }} → {{ playbook_dir }}/etcd-backup/"
    step_name: "etcdctl snapshot save"
    target: "{{ etcd_node }}"

- name: etcd snapshot (hostPath /var/lib/etcd)
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf
      -n kube-system exec etcd-{{ etcd_node }} --
      etcdctl --endpoints=https://127.0.0.1:2379
      --cacert=/etc/kubernetes/pki/etcd/ca.crt
      --cert=/etc/kubernetes/pki/etcd/server.crt
      --key=/etc/kubernetes/pki/etcd/server.key
      snapshot save /var/lib/etcd/{{ snap_name }}
  register: etcd_snap
  changed_when: true

- name: Забрать снапшот на ноутбук
  ansible.builtin.fetch:
    src: /var/lib/etcd/{{ snap_name }}
    dest: "{{ playbook_dir }}/etcd-backup/"
    flat: true

- name: Убрать снапшот с CP-ноды
  ansible.builtin.file:
    path: /var/lib/etcd/{{ snap_name }}
    state: absent

- name: Показать результат
  ansible.builtin.debug:
    msg: "{{ etcd_snap.stdout_lines | default([]) }}"
